spring.application.name=springboot-application

# H2の管理画面の設定
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Render用
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dev;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# H2用のドライバーが動くように初期値を設定します
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# PAの自動判別を有効
spring.jpa.open-in-view=false

server.port=8080
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Flywayの自動マイグレーション設定
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false