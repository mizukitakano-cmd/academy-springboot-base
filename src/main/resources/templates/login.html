<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo2">My Portfolio</div>
        </header>

        <main class="main-container">

            <h1 class="page-title">ログイン</h1>
                <form th:action="@{/login}" method="post" class="signup-form" novalidate>
                
                    <div th:if="${loginError}" th:text="${loginError}" class="error-msg" style="color: red; font-size: 14px; margin-bottom: 15px; text-align: left;"></div>

                        <div class="form-group">
                            <label class="form-label">メールアドレス</label>
                            <input type="text" name="username" placeholder="example@email.com" />
                        </div>

                        <div class="form-group">
                            <label class="form-label">パスワード</label>
                            <input type="password" name="password" placeholder="パスワードを入力してください。" />
                        </div>

                        <div class="button-group">
                            <button type="submit" class="submit-btn">ログインする</button>
                            <a th:href="@{/signup}" class="sub-btn">新規登録する</a>
                        </div>
                </form>
        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>

    </body>
</html>
