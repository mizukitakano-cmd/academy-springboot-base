<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo">My Portfolio</div>
        </header>

        <main class="main-container">

            <h1 class="page-title">新規登録</h1>


            <form th:action="@{/register}" th:object="${springbootForm}" method="post" class="signup-form" novalidate>
                
                <div class="form-group">
                    <label class="form-label">メールアドレス</label>
                    <input type="text" th:field="*{email}" placeholder="example@email.com" />
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red; font-size: 14px; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">パスワード</label>
                    <input type="password" th:field="*{password}" placeholder="パスワードを入力してください。" />
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red; font-size: 14px; margin-top: 5px;"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">ログインする</button>

                    <a th:href="@{/register}" class="sub-btn">新規登録する</a>
                </div>

            </form>

        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>

    </body>
</html>
