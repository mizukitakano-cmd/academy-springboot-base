<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo">My Portfolio</div>
            <a th:href="@{/login}" class="header-btn">ログイン</a>
        </header>

        <main class="main-container">

            <h1 class="page-title">ログイン</h1>

            <form th:action="@{/login}" method="post" class="signup-form" novalidate>
                
                <div th:if="${errorMessage}" class="error-msg" style="margin-top: 0; margin-bottom: -20px;">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="form-group">
                    <label class="form-label">メールアドレス</label>
                    <input type="text" name="email" placeholder="メールアドレスを入力してください" required />
                </div>

                <div class="form-group">
                    <label class="form-label">パスワード</label>
                    <input type="password" name="password" placeholder="パスワードを入力してください" required />
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn" style="margin: 0;">ログイン</button>
                    <a th:href="@{/signin}" class="sub-btn" style="background-color: #6c757d;">新規登録する</a>
                </div>

            </form>

        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>

    </body>
</html>
