<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ログイン</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo">My Portfolio</div>
        </header>

        <main class="main-container">

            <h1 class="page-title">ログイン</h1>

            <div th:if="${errorMessage}" style="color: red; font-size: 14px; font-weight: bold; margin-bottom: 15px; text-align: center;">
                <p th:text="${errorMessage}"></p>
            </div>

            <form th:action="@{/login}" method="post" class="signup-form" novalidate>
                
                <div class="form-group">
                    <label class="form-label">メールアドレス</label>
                    <input type="text" name="email" placeholder="example@email.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label">パスワード</label>
                    <input type="password" name="password" placeholder="パスワードを入力してください" required />
                </div>

                <div class="button-group" style="display: flex; flex-direction: column; gap: 10px;">
                    <button type="submit" class="submit-btn">ログイン</button>
                    
                    <a th:href="@{/signin}" style="text-decoration: none; width: 100%;">
                        <button type="button" class="submit-btn" style="background-color: #6c757d;">新規登録する</button>
                    </a>
                </div>

            </form>

        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>

    </body>
</html>
