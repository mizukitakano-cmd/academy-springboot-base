<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>新規登録</title>
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </head>
    <body>

        <header class="header">
            <div class="logo">My Portfolio</div>
            <a th:href="@{/login}" class="header-btn">ログイン</a>
        </header>

        <main class="main-container">

            <h1 class="page-title">新規登録</h1>

            <form th:action="@{/register}" th:object="${springbootForm}" method="post" class="signup-form" novalidate>
                
                <div class="form-group">
                    <label class="form-label">氏名</label>
                    <input type="text" th:field="*{name}" placeholder="氏名を入力してください" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-msg"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">メールアドレス</label>

                    <input type="text" th:field="*{email}" placeholder="メールアドレスを入力してください" />
                    
                    <div th:if="${#fields.hasErrors('email')}" class="error-msg">
                        <p th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">パスワード</label>
                    <input type="password" th:field="*{password}" placeholder="パスワードを入力してください" />
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-msg"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn" style="margin: 0;">登録する</button>
                </div>

            </form>

        </main>

        <footer class="footer">
            <div class="footer-logo">portfolio site</div>
        </footer>

    </body>
</html>
